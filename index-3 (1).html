<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>PKG Salary Calculation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --paper:#F6F8FB;
    --paper-line:rgba(15,23,42,0.02);
    --card:#FFFFFF;
    --ink:#0F172A;
    --ink-soft:#64748B;
    --navy:#0F172A;
    --navy-deep:#060B14;
    --slate:#334155;
    --brass:#3B82F6;
    --brass-deep:#2563EB;
    --brass-soft:#E8F0FE;
    --oxblood:#DC2626;
    --oxblood-soft:#FEE2E2;
    --forest:#10B981;
    --forest-soft:#D9F7EA;
    --amber:#F59E0B;
    --amber-deep:#B45309;
    --amber-soft:#FEF3C7;
    --line:#E6EAF1;
    --shadow-sm:0 1px 2px rgba(15,23,42,0.05), 0 1px 3px rgba(15,23,42,0.06);
    --shadow-md:0 4px 14px rgba(15,23,42,0.07);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:44px;
  }
  .topbar{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:#F1F5F9;
    padding:18px 16px 18px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-40px; top:-50px;
    width:180px; height:180px;
    background:radial-gradient(circle, rgba(59,130,246,0.18), transparent 70%);
    border-radius:50%;
  }
  .toprow{ display:flex; align-items:center; justify-content:space-between; gap:8px; position:relative; z-index:1; }
  .toprow-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .back-btn{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
    color:#F1F5F9; width:32px; height:32px; border-radius:9px; font-size:16px; cursor:pointer; flex-shrink:0;
    transition:background .15s ease;
  }
  .back-btn:hover{ background:rgba(255,255,255,0.16); }
  .brand-seal{
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    border:1px solid rgba(59,130,246,0.4); display:flex; align-items:center; justify-content:center;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:14px; color:var(--brass);
    background:rgba(59,130,246,0.12);
  }
  .title-block{ min-width:0; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:#93C5FD; margin:0 0 3px;
  }
  h1{
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:19px; margin:0;
    letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .sub{ font-size:11.5px; color:#94A3B8; margin-top:3px; font-family:'Inter',sans-serif; }
  .period-btn{
    background:rgba(59,130,246,0.14); border:1px solid rgba(59,130,246,0.4);
    color:#93C5FD; width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer; flex-shrink:0;
    transition:background .15s ease;
  }
  .period-btn:hover{ background:rgba(59,130,246,0.22); }
  .period-panel{
    display:none; margin-top:12px; background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px; position:relative; z-index:1;
  }
  .period-panel.open{ display:block; }
  .period-panel .row{ display:flex; gap:8px; }
  .period-panel .field{ flex:1; }
  .period-panel label{ font-size:9.5px; color:#93C5FD; text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:4px; }
  .period-panel input{
    width:100%; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.05);
    color:#F1F5F9; border-radius:8px; padding:8px 9px; font-family:'JetBrains Mono',monospace; font-size:12.5px;
  }
  .period-panel .apply-btn{
    margin-top:9px; width:100%; background:var(--brass); border:none; color:#fff;
    font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; padding:9px; border-radius:8px; cursor:pointer; font-size:13px;
    transition:background .15s ease;
  }
  .period-panel .apply-btn:hover{ background:var(--brass-deep); }
  .period-readout{ font-size:11px; color:#93C5FD; margin-top:6px; font-family:'JetBrains Mono',monospace; }

  .wrap{ padding:14px; max-width:720px; margin:0 auto; }

  @media (min-width:900px){
    body{ padding-bottom:60px; }
    .topbar{ padding:22px 5% 22px; }
    .toprow{ max-width:1100px; margin:0 auto; }
    .period-panel{ max-width:1100px; margin-left:auto; margin-right:auto; }
    .wrap{ max-width:1100px; padding:26px 5% 40px; }
    h1{ font-size:22px; }
    .sub{ font-size:12.5px; }
    table.daygrid{ font-size:13px; }
    .detail-grid{ display:grid; grid-template-columns:1fr 1.25fr; gap:20px; align-items:start; }
    .detail-left, .detail-right{ min-width:0; }
  }
  @media (min-width:1300px){
    .toprow, .period-panel, .wrap{ max-width:1280px; }
  }

  /* ---------- LIST ---------- */
  .summary{ display:flex; gap:12px; margin:0 0 18px; }
  .sum-card{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  }
  .sum-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass);
  }
  .sum-card .lbl{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .sum-card .val{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; margin-top:4px; color:var(--ink); }

  .btn-add{
    width:100%; background:var(--navy); color:#fff; border:none; border-radius:var(--radius);
    padding:13px; font-size:14.5px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; margin-bottom:16px;
    cursor:pointer; letter-spacing:.01em; box-shadow:var(--shadow-sm); transition:background .15s ease, transform .1s ease;
  }
  .btn-add:hover{ background:#1E293B; }
  .btn-add:active{ transform:scale(0.99); }

  .register-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; padding:0 2px; }
  .register-head .t{ font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:700; color:var(--ink); }
  .register-head .n{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); }

  .roster{ display:flex; flex-direction:column; gap:9px; margin-bottom:6px; }
  .roster-row{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px;
    display:flex; align-items:center; gap:12px; cursor:pointer; position:relative;
    box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, border-color .15s ease, transform .1s ease;
  }
  .roster-row:hover{ box-shadow:var(--shadow-md); border-color:#CBD5E1; transform:translateY(-1px); }
  .roster-row:active{ transform:translateY(0); }
  .roster-sl{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--brass); font-weight:700;
    width:22px; text-align:center; flex-shrink:0; border-right:1px solid var(--line); padding-right:10px;
  }
  .roster-mid{ flex:1; min-width:0; }
  .roster-name{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14.5px; color:var(--ink); }
  .roster-id{ font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin-top:2px; }
  .roster-figs{ display:flex; gap:14px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-soft); margin-top:6px; }
  .roster-figs b{ color:var(--ink); font-size:11px; }
  .roster-total{ text-align:right; flex-shrink:0; }
  .roster-total .amt{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--brass-deep); }
  .roster-total .lbl{ font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .chevron{ color:#CBD5E1; font-size:16px; }

  .empty{ text-align:center; padding:44px 20px; color:var(--ink-soft); background:var(--card); border:1px dashed var(--line); border-radius:var(--radius); }
  .empty .big{ font-size:32px; margin-bottom:8px; }
  .note{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:16px; line-height:1.6; }
  .note b{ color:var(--ink); }

  /* ---------- DETAIL ---------- */
  .section-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px; box-shadow:var(--shadow-sm);
  }
  .section-lbl{
    font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; text-transform:none;
    letter-spacing:0; color:var(--ink); margin:0 0 14px; font-weight:700;
    display:flex; align-items:center; gap:7px;
  }
  .section-lbl .dot{
    width:7px; height:7px; border-radius:50%; background:var(--brass); flex-shrink:0;
  }
  .section-lbl:first-child{ margin-top:0; }
  .name-edit-row{ display:flex; gap:12px; margin-bottom:12px; }
  .name-edit-row:last-child{ margin-bottom:0; }
  .name-edit-row .field{ flex:1; }
  .field label{
    font-size:11px; color:var(--ink-soft); text-transform:none; letter-spacing:0;
    font-weight:600; display:block; margin-bottom:6px;
  }
  .field input, .field select{
    border:1px solid var(--line); background:#F8FAFC; border-radius:9px; padding:10px 11px;
    font-size:13.5px; font-family:'JetBrains Mono',monospace; color:var(--ink); width:100%; height:40px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .field.text input{ font-family:'Inter',sans-serif; font-weight:500; }
  .field input:focus, .field select:focus{
    outline:none; border-color:var(--brass); background:#fff; box-shadow:0 0 0 3px rgba(59,130,246,0.14);
  }
  .field input:hover, .field select:hover{ border-color:#CBD5E1; }

  .config-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:4px; }
  .config-grid .field.full{ grid-column:1/-1; }
  .holiday-field input, .duty-field input{ border-color:var(--brass-soft); background:var(--brass-soft); font-weight:600; color:var(--brass-deep); }
  .icon-label{ display:flex; align-items:center; gap:5px; }
  .icon-label .ic{ font-size:12px; }
  .auto-tag{
    font-size:8.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700;
    color:var(--forest); background:var(--forest-soft); border:1px solid rgba(16,185,129,0.35);
    padding:1px 6px; border-radius:999px; margin-left:2px;
  }

  .period-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--brass-soft); color:var(--brass-deep); border:1px solid rgba(59,130,246,0.25);
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; padding:6px 12px; border-radius:999px; margin-bottom:16px;
  }

  .input-with-clear{ position:relative; }
  .input-with-clear input{ padding-right:36px; }
  .clear-name-btn{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:7px; border:1px solid var(--line);
    background:#F1F5F9; color:var(--ink-soft); font-size:12px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .clear-name-btn:hover{ background:var(--oxblood-soft); color:var(--oxblood); border-color:var(--oxblood); }
  .attendance-summary{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .stat-pill{
    flex:1; min-width:90px; background:#F8FAFC; border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; display:flex; flex-direction:column; gap:2px;
  }
  .stat-pill .k{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:600; display:flex; align-items:center; gap:5px; }
  .stat-pill .k .sw{ width:7px; height:7px; border-radius:2px; display:inline-block; }
  .stat-pill .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--ink); }
  .stat-pill.present .k .sw{ background:var(--forest); }
  .stat-pill.absent .k .sw{ background:var(--oxblood); }
  .stat-pill.off .k .sw{ background:var(--ink-soft); }
  .stat-pill.overtime .k .sw{ background:var(--brass); }

  .day-table-wrap{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
  .day-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.daygrid{ border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12px; width:100%; }
  table.daygrid thead th{
    background:var(--navy); color:#F1F5F9; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em;
    padding:9px 6px; white-space:nowrap; position:sticky; top:0; font-family:'Inter',sans-serif; font-weight:600;
  }
  table.daygrid td{ padding:7px 5px; border-top:1px solid var(--line); background:var(--card); white-space:nowrap; }
  table.daygrid td.date-cell{
    position:sticky; left:0; background:#F8FAFC; font-weight:700; color:var(--ink);
    text-align:center; border-right:1px solid var(--line); font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px;
  }
  table.daygrid tr.off-row td{ background:#F1F5F9; }
  table.daygrid tr.absent-row td{ background:var(--oxblood-soft); }
  table.daygrid select.status-sel{
    border:1px solid var(--line); border-radius:7px; padding:6px 4px; font-family:'JetBrains Mono',monospace;
    font-size:11px; background:#fff; color:var(--ink); width:80px; transition:border-color .15s ease;
  }
  table.daygrid select.status-sel:focus{ outline:none; border-color:var(--brass); }
  table.daygrid input.min-input{
    width:42px; border:1px solid var(--line); border-radius:7px; padding:6px 4px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:#fff; color:var(--ink); text-align:center;
  }
  td.net-cell{ font-weight:700; text-align:center; color:var(--forest); width:44px; }
  td.extra-cell{ font-weight:700; text-align:center; color:var(--brass-deep); width:44px; background:var(--brass-soft) !important; }

  .time-cell{ display:flex; align-items:center; gap:3px; }
  .time-txt{
    width:46px; border:1px solid var(--line); border-radius:7px; padding:6px 4px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; text-align:center; background:#fff; color:var(--ink);
    transition:border-color .15s ease;
  }
  .time-txt:focus{ outline:none; border-color:var(--brass); }
  select.ampm-sel{
    border:1px solid var(--line); border-radius:7px; padding:6px 3px; font-family:'JetBrains Mono',monospace;
    font-size:10.5px; font-weight:700; background:#F1F5F9; color:var(--slate); width:42px;
  }

  .calc-strip{
    background:#F8FAFC; border:1px solid var(--line); border-radius:10px; padding:14px 16px;
    display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;
  }
  .calc-item{ display:flex; flex-direction:column; }
  .calc-item .k{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .calc-item .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; margin-top:3px;}
  .v.deduct{ color:var(--oxblood); }
  .v.bonus{ color:var(--forest); }
  .v.amber{ color:var(--brass-deep); }

  .grand{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy)); color:#F1F5F9; border-radius:var(--radius); padding:18px 20px;
    display:flex; flex-direction:column; gap:6px; margin-bottom:16px; box-shadow:var(--shadow-md);
  }
  .grand-line{ display:flex; justify-content:space-between; font-size:12.5px; color:#94A3B8; padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .grand-line b{ color:#F1F5F9; font-family:'JetBrains Mono',monospace; font-weight:500; }
  .grand-final{
    display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:12px;
    border-top:1px solid rgba(59,130,246,0.35);
  }
  .grand-final .k{ font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:700; letter-spacing:.01em; }
  .grand-final .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:#93C5FD; }

  .btn-print{
    width:100%; background:#fff; border:1.5px solid var(--brass); color:var(--brass-deep);
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14px; padding:12px; border-radius:10px;
    cursor:pointer; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s ease, box-shadow .15s ease;
  }
  .btn-print:hover{ background:var(--brass-soft); box-shadow:var(--shadow-sm); }
  .print-btn-row{ display:flex; gap:8px; }
  .print-btn-row .btn-print{ flex:1; margin-top:0; }
  .label-btn{ border-color:var(--forest); color:#0D7A54; background:var(--forest-soft); }
  .label-btn:hover{ background:#C7F0DC; }
  .pdf-status{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-bottom:18px; min-height:14px; }

  /* ---------- MENU / MODALS ---------- */
  .menu-item{
    width:100%; text-align:left; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
    color:#F1F5F9; padding:11px 13px; border-radius:9px; font-size:13px; margin-bottom:8px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:500; display:flex; align-items:center; gap:8px; transition:background .15s ease;
  }
  .menu-item:hover{ background:rgba(255,255,255,0.1); }
  .menu-item:last-child{ margin-bottom:0; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,11,20,0.6); backdrop-filter:blur(2px); z-index:1000;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background:var(--card); border-radius:16px; padding:22px; max-width:420px; width:100%;
    max-height:85vh; overflow-y:auto; box-shadow:0 20px 50px rgba(15,23,42,0.28);
  }
  .modal-card h2{ font-family:'Plus Jakarta Sans',sans-serif; font-size:17px; margin:0 0 4px; color:var(--ink); font-weight:700; }
  .modal-card p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }
  .modal-field input[type=password]{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:11px;
    font-family:'JetBrains Mono',monospace; font-size:14px; margin-bottom:8px; background:#F8FAFC; color:var(--ink);
  }
  .modal-field input[type=password]:focus{ outline:none; border-color:var(--brass); background:#fff; box-shadow:0 0 0 3px rgba(59,130,246,0.14); }
  .modal-error{ color:var(--oxblood); font-size:12px; margin-bottom:8px; min-height:14px; }
  .modal-btn-row{ display:flex; gap:8px; margin-top:10px; }
  .modal-btn{ flex:1; padding:11px; border-radius:10px; border:none; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; transition:opacity .15s ease; }
  .modal-btn:hover{ opacity:0.9; }
  .modal-btn.primary{ background:var(--navy); color:#fff; }
  .modal-btn.ghost{ background:#F1F5F9; color:var(--ink); border:1px solid var(--line); }
  .viewer-link{ display:block; text-align:center; margin-top:14px; font-size:12.5px; color:var(--brass-deep); cursor:pointer; text-decoration:underline; }
  .emp-check-row{ display:flex; align-items:center; gap:10px; padding:6px 9px; border-bottom:none; font-size:12.5px; background:#F8FAFC; border-radius:8px; margin-bottom:4px; }
  .emp-check-row input{ width:16px; height:16px; flex-shrink:0; accent-color:var(--brass); }
  .emp-check-row .nm{ flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; }
  .emp-check-row .amt{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .select-all-row{ display:flex; align-items:center; gap:10px; padding:8px 4px 12px; border-bottom:1px solid var(--line); font-weight:600; font-size:13px; margin-bottom:6px; }
  .select-all-row input{ width:16px; height:16px; accent-color:var(--brass); }
  .lock-banner{
    background:var(--amber-soft); color:var(--amber-deep); border:1px solid rgba(245,158,11,0.35);
    border-radius:10px; padding:11px 14px; font-size:12.5px; font-weight:600; text-align:left;

<script>
const EMP_KEY = 'employees_v5';
const PERIOD_KEY = 'period_v1';
let employees = [];
let period = { start:'', end:'' };
let view = { mode: 'list' };
let unlocked = false;
const APP_PASSWORD = 'Alamxir00';

function uid(){ return 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function money(n){ return '৳' + n.toLocaleString('en-IN', {maximumFractionDigits:2}); }
function moneyPdf(n){ return 'Tk ' + n.toLocaleString('en-IN', {maximumFractionDigits:2}); }
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toISO(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function enumerateDates(start, end){
  let dates=[]; let cur=start; let guard=0;
  while(cur<=end && guard<400){ dates.push(cur); cur=addDays(cur,1); guard++; }
  return dates;
}
function formatDateLabel(iso){
  const d=new Date(iso+'T00:00:00');
  return d.getDate() + ' ' + d.toLocaleString('en-US',{month:'short'});
}
function formatDateLabelFull(iso){
  const d=new Date(iso+'T00:00:00');
  return d.getDate() + ' ' + d.toLocaleString('en-US',{month:'long'});
}
function defaultPeriod(){
  const today = new Date();
  const endDate = new Date(today.getFullYear(), today.getMonth(), 25);
  const startDate = new Date(today.getFullYear(), today.getMonth()-1, 26);
  return { start: toISO(startDate), end: toISO(endDate) };
}

function blankEmployee(){
  return { id: uid(), name:'', designation:'', empId:'', basicSalary:'', perHourRate:'', dutyHour:'',
    dutyStart:'', dutyStartPeriod:'AM', dutyEnd:'', dutyEndPeriod:'PM', govtHolidayDays:'', govtHolidayAmount:'', days:{} };
}
function getDay(emp, d){
  return emp.days[d] || { checkIn:'', checkInPeriod:'AM', checkOut:'', checkOutPeriod:'PM', status:'present' };
}

/* parse "9:30" + AM/PM into minutes-from-midnight */
function parseTime12(str, per){
  if(!str) return null;
  const parts = String(str).split(':');
  let h = parseInt(parts[0],10);
  let m = parts.length>1 ? parseInt(parts[1],10) : 0;
  if(isNaN(h)) return null;
  if(isNaN(m)) m = 0;
  if(per === 'AM'){ if(h===12) h=0; } else { if(h!==12) h+=12; }
  return h*60+m;
}

/* Extra time auto-computed: worked duration minus duty hour */
function computeAutoExtraMinutes(day, dutyHour){
  const inMin = parseTime12(day.checkIn, day.checkInPeriod);
  const outMin = parseTime12(day.checkOut, day.checkOutPeriod);
  if(inMin===null || outMin===null) return 0;
  let worked = outMin - inMin;
  if(worked < 0) worked += 24*60;
  const dutyMin = num(dutyHour) * 60;
  return Math.max(0, worked - dutyMin);
}
/* Late time auto-computed: check-in time minus duty period start time */
function computeAutoLateMinutes(emp, day){
  const dutyStartMin = parseTime12(emp.dutyStart, emp.dutyStartPeriod);
  const inMin = parseTime12(day.checkIn, day.checkInPeriod);
  if(dutyStartMin===null || inMin===null) return 0;
  let diff = inMin - dutyStartMin;
  if(diff < -720) diff += 24*60;   /* overnight duty wrap-around */
  if(diff > 720) diff -= 24*60;
  return Math.max(0, diff);
}
/* Duty Hour auto-computed from Duty Start Time and Duty End Time */
function calcAutoDutyHour(emp){
  const startMin = parseTime12(emp.dutyStart, emp.dutyStartPeriod);
  const endMin = parseTime12(emp.dutyEnd, emp.dutyEndPeriod);
  if(startMin===null || endMin===null) return '';
  let diff = endMin - startMin;
  if(diff <= 0) diff += 24*60;
  const hours = diff/60;
  return (Math.round(hours*100)/100).toString();
}
/* Per-hour rate auto-computed from Basic Salary and Duty Hour, using the actual number of days in the selected period */
function calcAutoPerHourRate(emp){
  const dh = num(emp.dutyHour);
  const basic = num(emp.basicSalary);
  const days = enumerateDates(period.start, period.end).length || 30;
  if(dh<=0 || basic<=0) return '';
  return (basic / (days * dh)).toFixed(2);
}
function dayNetExtra(day, emp){
  const autoExtra = computeAutoExtraMinutes(day, emp.dutyHour);
  const autoLate = computeAutoLateMinutes(emp, day);
  return Math.max(0, autoExtra - autoLate);
}

function monthlyCalc(emp){
  const dates = enumerateDates(period.start, period.end);
  let totalNet=0, totalLate=0, absentDays=0;
  dates.forEach(dt => {
    const day = getDay(emp, dt);
    totalNet += dayNetExtra(day, emp);
    totalLate += computeAutoLateMinutes(emp, day);
    if(day.status==='absent') absentDays++;
  });
  const extraHour = totalNet/60;
  const amount = extraHour * num(emp.perHourRate);
  const basic = num(emp.basicSalary);
  const holiday = num(emp.govtHolidayAmount);
  const totalDaysInPeriod = dates.length || 1;
  const perDayRate = basic / totalDaysInPeriod;
  const absentDeduction = perDayRate * absentDays;
  const grand = basic + amount + holiday - absentDeduction;
  return { totalNet, totalLate, extraHour, amount, basic, holiday, absentDays, perDayRate, absentDeduction, grand, dates };
}

async function loadPeriod(){
  try{
    const raw = localStorage.getItem(PERIOD_KEY);
    period = raw ? JSON.parse(raw) : defaultPeriod();
  }catch(e){ period = defaultPeriod(); }
}
async function savePeriod(){
  try{ localStorage.setItem(PERIOD_KEY, JSON.stringify(period)); }catch(e){ console.error(e); }
}
async function loadEmployees(){
  try{
    const raw = localStorage.getItem(EMP_KEY);
    employees = raw ? JSON.parse(raw) : [];
  }catch(e){ employees = []; }
}
async function saveEmployees(){
  try{ localStorage.setItem(EMP_KEY, JSON.stringify(employees)); }catch(e){ console.error('save failed', e); }
}

function addEmployee(){
  if(!unlocked){ openLockOverlay(); return; }
  employees.push(blankEmployee());
  saveEmployees();
  view = { mode:'detail', id: employees[employees.length-1].id };
  render();
}
function deleteEmployee(id){
  if(!unlocked){ openLockOverlay(); return; }
  employees = employees.filter(e=>e.id!==id); saveEmployees(); render();
}
function openDetail(id){ view={mode:'detail', id}; render(); }
function goList(){ view={mode:'list'}; render(); }

function updateEmpField(id, field, value){
  if(!unlocked) return;
  const emp = employees.find(e=>e.id===id);
  if(!emp) return;
  emp[field] = value;
  if(field==='dutyStart' || field==='dutyStartPeriod' || field==='dutyEnd' || field==='dutyEndPeriod'){
    const autoHour = calcAutoDutyHour(emp);
    if(autoHour !== ''){
      emp.dutyHour = autoHour;
      const dhEl = document.querySelector('[data-empfield="dutyHour"]');
      if(dhEl) dhEl.value = autoHour;
    }
  }
  if(field==='basicSalary' || field==='dutyHour' || field==='dutyStart' || field==='dutyStartPeriod' || field==='dutyEnd' || field==='dutyEndPeriod'){
    const auto = calcAutoPerHourRate(emp);
    if(auto !== ''){
      emp.perHourRate = auto;
      const phrEl = document.querySelector('[data-empfield="perHourRate"]');
      if(phrEl) phrEl.value = auto;
    }
  }
  saveEmployees();
  if(view.mode==='detail'){
    if(field==='dutyHour' || field==='dutyStart' || field==='dutyStartPeriod' || field==='dutyEnd' || field==='dutyEndPeriod'){
      refreshAllDayRows(emp);
    }
    updateFooterUI(emp);
  }
}
function updateDayField(id, d, field, value){
  if(!unlocked) return;
  const emp = employees.find(e=>e.id===id);
  if(!emp) return;
  if(!emp.days[d]) emp.days[d] = getDay(emp, d);
  emp.days[d][field] = value;
  saveEmployees();
  updateDayRowUI(emp, d);
  updateFooterUI(emp);
}
function updateDayRowUI(emp, d){
  const day = getDay(emp, d);
  const autoExtra = computeAutoExtraMinutes(day, emp.dutyHour);
  const autoLate = computeAutoLateMinutes(emp, day);
  const net = Math.max(0, autoExtra - autoLate);
  const lateCell = document.getElementById('late_'+emp.id+'_'+d);
  if(lateCell) lateCell.textContent = autoLate;
  const extraCell = document.getElementById('extra_'+emp.id+'_'+d);
  if(extraCell) extraCell.textContent = autoExtra;
  const netCell = document.getElementById('net_'+emp.id+'_'+d);
  if(netCell) netCell.textContent = net;
  const row = document.getElementById('row_'+emp.id+'_'+d);
  if(row) row.className = day.status==='off' ? 'off-row' : (day.status==='absent' ? 'absent-row' : '');
}
function refreshAllDayRows(emp){
  const dates = enumerateDates(period.start, period.end);
  dates.forEach(d => updateDayRowUI(emp, d));
}
function updateFooterUI(emp){
  const c = monthlyCalc(emp);
  const set = (id, txt) => { const el=document.getElementById(id); if(el) el.textContent = txt; };
  set('m_totalLate', c.totalLate+' min');
  set('m_totalNet', c.totalNet+' min');
  set('m_hour', c.extraHour.toFixed(2)+' h');
  set('m_amount', money(c.amount));
  set('m_amount2', money(c.amount));
  set('m_basic', money(c.basic));
  set('m_holiday', money(c.holiday));
  set('m_absentDays', c.absentDays);
  set('m_absentDeduction', money(c.absentDeduction));
  set('m_absentDeductionLine', money(c.absentDeduction));
  set('m_grand', money(c.grand));
  let presentCount=0, absentCount=0, offCount=0;
  c.dates.forEach(dt => {
    const day = getDay(emp, dt);
    if(day.status==='off') offCount++;
    else if(day.status==='absent') absentCount++;
    else presentCount++;
  });
  set('statPresent', presentCount);
  set('statAbsent', absentCount);
  set('statOff', offCount);
  set('statOvertime', c.extraHour.toFixed(1)+'h');
}

/* ---------------- PERIOD PANEL ---------------- */
function periodLabel(){
  return formatDateLabelFull(period.start) + ' – ' + formatDateLabelFull(period.end) + ', ' + new Date(period.end+'T00:00:00').getFullYear();
}
function refreshPeriodReadout(){
  document.getElementById('periodReadout').textContent = 'Current period: ' + periodLabel();
  document.getElementById('periodStartInput').value = period.start;
  document.getElementById('periodEndInput').value = period.end;
}
document.getElementById('periodBtn').addEventListener('click', () => {
  document.getElementById('periodPanel').classList.toggle('open');
});
document.getElementById('periodApplyBtn').addEventListener('click', async () => {
  const s = document.getElementById('periodStartInput').value;
  const e = document.getElementById('periodEndInput').value;
  if(s && e && s <= e){
    period = { start:s, end:e };
    employees.forEach(emp => {
      const auto = calcAutoPerHourRate(emp);
      if(auto !== '') emp.perHourRate = auto;
    });
    await savePeriod();
    await saveEmployees();
    document.getElementById('periodPanel').classList.remove('open');
    refreshPeriodReadout();
    render();
  }
});

/* ---------------- LIST ---------------- */
function renderList(){
  const wrap = document.getElementById('wrap');
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('pageTitle').textContent = 'PKG Salary Calculation';
  document.getElementById('pageSub').textContent = 'Monthly attendance & salary ledger';
  document.getElementById('eyebrow').textContent = 'Payroll Register';

  const totalGrand = employees.reduce((s,e)=>s+monthlyCalc(e).grand, 0);

  let body = '';
  if(employees.length===0){
    body = `<div class="empty"><div class="big">🧾</div>Register is empty.<br/>Tap "Add Employee" to open the first ledger entry.</div>`;
  } else {
    let rows = '';
    employees.forEach((emp, idx) => {
      const c = monthlyCalc(emp);
      rows += `
      <div class="roster-row" data-open="${emp.id}">
        <div class="roster-sl">${String(idx+1).padStart(2,'0')}</div>
        <div class="roster-mid">
          <div class="roster-name">${emp.name ? escapeHtml(emp.name) : 'Unnamed employee'}${emp.designation ? ' <span style="font-weight:400;color:var(--ink-soft);font-size:11.5px;">— '+escapeHtml(emp.designation)+'</span>' : ''}</div>
          <div class="roster-id">${emp.empId ? 'ID '+escapeHtml(emp.empId) : 'ID —'}</div>
          <div class="roster-figs">
            <span>Basic <b>${money(c.basic)}</b></span>
            <span>Extra <b>${money(c.amount)}</b></span>
            <span>Holiday <b>${money(c.holiday)}</b></span>
          </div>
        </div>
        <div class="roster-total">
          <div class="amt">${money(c.grand)}</div>
          <div class="lbl">Grand Total</div>
        </div>
        <div class="chevron">›</div>
      </div>`;
    });
    body = `
      <div class="register-head"><span class="t">Employee Roster</span><span class="n">${employees.length} record${employees.length>1?'s':''}</span></div>
      <div class="roster">${rows}</div>
      <div class="note">All records are saved automatically on this device. Tap an employee to open and edit their ledger.</div>
    `;
  }

  wrap.innerHTML = `
    <div class="summary">
      <div class="sum-card"><div class="lbl">Employees</div><div class="val">${employees.length}</div></div>
      <div class="sum-card"><div class="lbl">Grand Total (All)</div><div class="val">${money(totalGrand)}</div></div>
    </div>
    <button class="btn-add" id="btnAdd">+ Add Employee</button>
    ${body}
  `;
  document.getElementById('btnAdd').addEventListener('click', addEmployee);
  wrap.querySelectorAll('[data-open]').forEach(row => {
    row.addEventListener('click', () => openDetail(row.getAttribute('data-open')));
  });
}

/* ---------------- DETAIL ---------------- */
function timeCell(emp, d, which, day){
  const isIn = which==='in';
  const val = isIn ? day.checkIn : day.checkOut;
  const per = isIn ? day.checkInPeriod : day.checkOutPeriod;
  const field = isIn ? 'checkIn' : 'checkOut';
  const perField = isIn ? 'checkInPeriod' : 'checkOutPeriod';
  return `
  <td>
    <div class="time-cell">
      <input class="time-txt" type="text" inputmode="numeric" maxlength="5" placeholder="${isIn?'09:00':'06:00'}"
        value="${escapeHtml(val)}" data-day="${d}" data-field="${field}" />
      <select class="ampm-sel" data-day="${d}" data-field="${perField}">
        <option value="AM" ${per==='AM'?'selected':''}>AM</option>
        <option value="PM" ${per==='PM'?'selected':''}>PM</option>
      </select>
    </div>
  </td>`;
}
function dutyTimeField(emp, which){
  const isStart = which==='start';
  const val = isStart ? emp.dutyStart : emp.dutyEnd;
  const per = isStart ? emp.dutyStartPeriod : emp.dutyEndPeriod;
  const field = isStart ? 'dutyStart' : 'dutyEnd';
  const perField = isStart ? 'dutyStartPeriod' : 'dutyEndPeriod';
  return `
    <div class="time-cell">
      <input class="time-txt" type="text" inputmode="numeric" maxlength="5" placeholder="${isStart?'10:00':'08:00'}"
        value="${escapeHtml(val)}" data-empfield="${field}" />
      <select class="ampm-sel" data-empfield="${perField}">
        <option value="AM" ${per==='AM'?'selected':''}>AM</option>
        <option value="PM" ${per==='PM'?'selected':''}>PM</option>
      </select>
    </div>`;
}
function dayRow(emp, d){
  const day = getDay(emp, d);
  const autoExtra = computeAutoExtraMinutes(day, emp.dutyHour);
  const autoLate = computeAutoLateMinutes(emp, day);
  const net = Math.max(0, autoExtra - autoLate);
  const rowClass = day.status==='off' ? 'off-row' : (day.status==='absent' ? 'absent-row' : '');
  return `
  <tr id="row_${emp.id}_${d}" class="${rowClass}">
    <td class="date-cell">${formatDateLabel(d)}</td>
    ${timeCell(emp, d, 'in', day)}
    ${timeCell(emp, d, 'out', day)}
    <td>
      <select class="status-sel" data-day="${d}" data-field="status">
        <option value="present" ${day.status==='present'?'selected':''}>Present</option>
        <option value="off" ${day.status==='off'?'selected':''}>Day Off</option>
        <option value="absent" ${day.status==='absent'?'selected':''}>Absent</option>
      </select>
    </td>
    <td class="extra-cell" id="late_${emp.id}_${d}" style="background:var(--oxblood-soft) !important;color:var(--oxblood);">${autoLate}</td>
    <td class="extra-cell" id="extra_${emp.id}_${d}">${autoExtra}</td>
    <td class="net-cell" id="net_${emp.id}_${d}">${net}</td>
  </tr>`;
}

function renderDetail(emp){
  document.getElementById('backBtn').style.display = 'inline-block';
  document.getElementById('pageTitle').textContent = emp.name || 'Unnamed employee';
  document.getElementById('pageSub').textContent = (emp.empId ? 'ID '+emp.empId+' — ' : '') + 'Ledger entry';
  document.getElementById('eyebrow').textContent = 'Employee Ledger';

  const wrap = document.getElementById('wrap');
  const c = monthlyCalc(emp);
  let daysRows = c.dates.map(d => dayRow(emp, d)).join('');

  let presentCount=0, absentCount=0, offCount=0;
  c.dates.forEach(dt => {
    const day = getDay(emp, dt);
    if(day.status==='off') offCount++;
    else if(day.status==='absent') absentCount++;
    else presentCount++;
  });

  wrap.innerHTML = `
    ${!unlocked ? `<div class="lock-banner" id="unlockBannerBtn"><span class="lock-ic">🔒</span> Viewer Mode — tap to unlock editing</div>` : ''}
    <div class="period-chip">📆 Period: ${periodLabel()}</div>

    <div class="detail-grid">
    <div class="detail-left">

    <div class="section-card">
      <div class="section-lbl"><span class="dot"></span>Employee Details</div>
      <div class="name-edit-row">
        <div class="field text"><label>Employee Name</label>
          <div class="input-with-clear">
            <input type="text" value="${escapeHtml(emp.name)}" data-empfield="name" placeholder="Full name" id="empNameInput" />
            <button type="button" class="clear-name-btn" id="clearNameBtn" title="Clear name">✕</button>
          </div>
        </div>
        <div class="field text"><label>Position / Designation</label><input type="text" value="${escapeHtml(emp.designation)}" data-empfield="designation" placeholder="e.g. Supervisor" /></div>
      </div>
      <div class="name-edit-row">
        <div class="field text"><label>Employee ID</label><input type="text" value="${escapeHtml(emp.empId)}" data-empfield="empId" placeholder="EMP-101" /></div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-lbl"><span class="dot"></span>Duty Period</div>

function downloadPDF(emp){
  const statusEl = document.getElementById('pdfStatus');
  try{
    if(!window.jspdf){
      statusEl.textContent = 'PDF library still loading — try again in a moment.';
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const c = monthlyCalc(emp);

    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.text('PKG Salary Calculation', 14, 16);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    doc.text('Monthly Payslip', 14, 22);

    doc.setFontSize(10);
    doc.text(`Employee: ${emp.name || 'Unnamed employee'}`, 14, 31);
    doc.text(`Designation: ${emp.designation || '-'}`, 14, 37);
    doc.text(`Employee ID: ${emp.empId || '-'}`, 14, 43);
    doc.text(`Period: ${periodLabel()}`, 14, 49);
    doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 55);

    const rows = c.dates.map(dt => {
      const day = getDay(emp, dt);
      const autoExtra = computeAutoExtraMinutes(day, emp.dutyHour);
      const autoLate = computeAutoLateMinutes(emp, day);
      const net = Math.max(0, autoExtra - autoLate);
      const inTime = day.checkIn ? (day.checkIn + ' ' + day.checkInPeriod) : '-';
      const outTime = day.checkOut ? (day.checkOut + ' ' + day.checkOutPeriod) : '-';
      return [formatDateLabel(dt), inTime, outTime, day.status, String(autoLate), String(autoExtra), String(net)];
    });

    doc.autoTable({
      head: [['Date','In','Out','Status','Late(m)','Extra(m)','Sub Total']],
      body: rows,
      startY: 61,
      styles: { fontSize: 7, cellPadding: 1.1 },
      headStyles: { fillColor: [15,56,38], textColor: [237,247,240] },
      alternateRowStyles: { fillColor: [219,242,225] }
    });

    let y = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(10.5);
    doc.text(`Basic Salary: ${moneyPdf(c.basic)}`, 14, y);
    doc.text(`Extra Amount: ${moneyPdf(c.amount)}  (Extra Hour: ${c.extraHour.toFixed(2)} h)`, 14, y+7);
    doc.text(`Government Holiday Amount: ${moneyPdf(c.holiday)}${emp.govtHolidayDays ? ' (' + emp.govtHolidayDays + ' days)' : ''}`, 14, y+14);
    doc.setTextColor(180,40,40);
    doc.text(`Absent Deduction: -${moneyPdf(c.absentDeduction)}  (${c.absentDays} day${c.absentDays===1?'':'s'})`, 14, y+21);
    doc.setTextColor(0,0,0);
    doc.setDrawColor(201,124,61);
    doc.setLineWidth(0.6);
    doc.line(14, y+26, 100, y+26);
    doc.setFont('helvetica','bold');
    doc.setFontSize(13);
    doc.setTextColor(15,56,38);
    doc.text(`Grand Total: ${moneyPdf(c.grand)}`, 14, y+34);
    doc.setTextColor(0,0,0);

    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
    doc.setTextColor(160,168,178);
    doc.text('Crafted© by Alamgir Ahmad (PKG)—2026', pageW/2, pageH-6, {align:'center'});
    doc.setTextColor(0,0,0);

    const fname = (emp.name || 'employee').replace(/[^a-zA-Z0-9]+/g,'_') + '_payslip.pdf';
    doc.save(fname);
    statusEl.textContent = 'PDF downloaded ✓';
    setTimeout(()=>{ statusEl.textContent=''; }, 3000);
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Could not generate PDF — please try again.';
  }
}

function combinedLabelPDF(selectedIds){
  if(!window.jspdf){ alert('PDF library still loading — try again in a moment.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'in', format:[3,5] });
  const selected = employees.filter(e => selectedIds.includes(e.id));

  selected.forEach((emp, idx) => {
    if(idx>0) doc.addPage([3,5], 'portrait');
    const c = monthlyCalc(emp);

    doc.setFillColor(15,56,38);
    doc.rect(0, 0, 3, 0.5, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
    doc.text('PKG Salary Slip', 0.15, 0.22);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
    doc.text(periodLabel(), 0.15, 0.4);

function combinedPrintPDF(selectedIds){
  if(!window.jspdf){ alert('PDF library still loading — try again in a moment.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('PKG Salary Calculation', 14, 16);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text('Salary Summary — ' + periodLabel(), 14, 22);
  doc.setFontSize(9);
  doc.text('Generated: ' + new Date().toLocaleDateString(), 14, 28);

  const selected = employees.filter(e => selectedIds.includes(e.id));
  let grandSum = 0;
  const rows = selected.map((emp, idx) => {
    const c = monthlyCalc(emp);
    grandSum += c.grand;
    return [String(idx+1), emp.name || 'Unnamed', emp.designation || '-', emp.empId || '-',
      moneyPdf(c.basic), moneyPdf(c.amount), moneyPdf(c.holiday), c.absentDays ? '-'+moneyPdf(c.absentDeduction)+' ('+c.absentDays+'d)' : moneyPdf(0), moneyPdf(c.grand)];
  });

  doc.autoTable({
    head: [['SL','Name','Designation','ID','Basic','Extra','Holiday','Absent Ded.','Grand Total']],
    body: rows,
    startY: 34,
    styles: { fontSize: 7.5, cellPadding: 1.4 },
    headStyles: { fillColor: [15,56,38], textColor: [237,247,240] },
    alternateRowStyles: { fillColor: [219,242,225] },
    foot: [['', '', '', '', '', '', '', 'Total', moneyPdf(grandSum)]],
    footStyles: { fillColor: [201,124,61], textColor: [255,255,255], fontStyle: 'bold' }
  });

  const pageCount = doc.internal.getNumberOfPages();
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
    doc.setTextColor(160,168,178);
    doc.text('Crafted© by Alamgir Ahmad (PKG)—2026', pageW/2, pageH-6, {align:'center'});
  }

  doc.save('salary_summary_' + toISO(new Date()) + '.pdf');
  document.getElementById('printOverlay').style.display = 'none';
}

function exportCSV(selectedIds){
  const selected = employees.filter(e => selectedIds.includes(e.id));
  const esc = v => '"' + String(v).replace(/"/g,'""') + '"';
  let csv = 'SL,Name,Designation,Employee ID,Basic Salary,Extra Amount,Govt Holiday Days,Govt Holiday Amount,Absent Days,Absent Deduction,Grand Total\n';
  let grandSum = 0;
  selected.forEach((emp, idx) => {
    const c = monthlyCalc(emp);
    grandSum += c.grand;
    csv += [idx+1, esc(emp.name||'Unnamed employee'), esc(emp.designation||''), esc(emp.empId||''),
      c.basic, c.amount.toFixed(2), esc(emp.govtHolidayDays||'0'), c.holiday, c.absentDays, c.absentDeduction.toFixed(2), c.grand.toFixed(2)].join(',') + '\n';
  });
  csv += `,,,,,,,,,Total,${grandSum.toFixed(2)}\n`;
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'salary_summary_' + toISO(new Date()) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('printOverlay').style.display = 'none';
}

  await loadPeriod();
